[versions]
# alineadas con Wasichai 1.10.0 (su gradle/libs.versions.toml): no se adelantan por separado
kotlin = "2.4.21"
springBoot = "4.1.2"
wasichai = "1.10.0"
ktlint = "14.2.0"
ktlintTool = "1.7.1"
# OpenAPI de Lesen: la línea 3.x es la de Spring Boot 4
springdoc = "3.2.0"

[libraries]
wasichai-bom = { module = "wasichai:wasichai-bom", version.ref = "wasichai" }
wasichai-starter = { module = "wasichai:wasichai-spring-boot-starter" }
wasichai-test = { module = "wasichai:wasichai-test" }
springdoc-webflux-api = { module = "org.springdoc:springdoc-openapi-starter-webflux-api", version.ref = "springdoc" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
