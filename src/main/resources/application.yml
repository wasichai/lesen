# La base de datos sale de WASICHAI_DB_HOST/PORT/NAME/USERNAME/PASSWORD (las lee Wasichai). El secreto del JWT no tiene
# valor por defecto a propósito: sin WASICHAI_JWT_SECRET la aplicación no arranca.
server:
  port: ${PORT:8095}

spring:
  application:
    name: lesen

# actuator: ni el entorno, ni las propiedades enlazadas, ni un volcado de memoria
management:
  endpoints:
    web:
      exposure:
        exclude: env,configprops,heapdump
  endpoint:
    env:
      show-values: never
    configprops:
      show-values: never

wasichai:
  security:
    jwt:
      secret: ${WASICHAI_JWT_SECRET:}
      revocation: true
    login:
      enabled: true
  web:
    problem-base-uri: ${LESEN_PROBLEM_BASE_URI:https://lesen.dev/problems}
    # orígenes de navegador que pueden llamar a la API, separados por comas. vacío: ninguno ajeno (UI y API en el mismo
    # dominio). Wasichai trae http://localhost:* para cualquier entorno
    cors-allowed-origin-patterns: ${WASICHAI_CORS_ALLOWED_ORIGINS:}

  # los archivos que se suben desde el estudio (audio y portadas, ADR-0012): disco local por defecto o S3
  # (wasichai.files.store=s3 y wasichai.files.s3.*). Se respaldan junto con la base (docs/operations.md)
  files:
    local:
      path: ${LESEN_FILES_PATH:./data/files}

lesen:
  demo:
    # publica el contenido de src/main/resources/demo al arrancar (docs/content/demo-content.md)
    enabled: ${LESEN_DEMO_ENABLED:false}
  ai:
    # sin clave, las respuestas abiertas se autoevalúan (ADR-0009)
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LESEN_AI_MODEL:claude-opus-5-5}
  generation:
    # lecturas a medida (ADR-0013): el esfuerzo del modelo y las correcciones antes de darla por fallida
    effort: ${LESEN_GENERATION_EFFORT:medium}
    max-corrections: ${LESEN_GENERATION_MAX_CORRECTIONS:2}
    workers: ${LESEN_GENERATION_WORKERS:1}
  illustration:
    # libros ilustrados (ADR-0015): none, fake, openai o gemini. Sin proveedor, las ilustraciones quedan pendientes
    provider: ${LESEN_ILLUSTRATION_PROVIDER:none}
    model: ${LESEN_ILLUSTRATION_MODEL:}
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    agent: ${LESEN_ILLUSTRATION_AGENT:true}
    max-retries: ${LESEN_ILLUSTRATION_MAX_RETRIES:1}

# OpenAPI de lo propio de Lesen, en una ruta pública
springdoc:
  api-docs:
    path: /api/lesen/public/openapi
  paths-to-match: /api/lesen/**
