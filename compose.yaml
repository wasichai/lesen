# Entorno local: PostgreSQL 18 publicado en loopback (el 5432 queda libre y ninguna prueba lo usa).
name: lesen

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${WASICHAI_DB_NAME:-lesen}
      POSTGRES_USER: ${WASICHAI_DB_USERNAME:-lesen}
      POSTGRES_PASSWORD: ${WASICHAI_DB_PASSWORD:-lesen-dev}
    ports:
      - '127.0.0.1:${WASICHAI_DB_PORT:-5437}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
